<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" role="img" aria-label="A left to right flow. The player asks a question. The board supplies which pieces defend which. The claim check tests the answer against it. The answer goes out. A greyed path sending every question to the chess engine was rejected as slow and against the rule.">
<rect width="720" height="250" rx="8" fill="#ffffff"/>
<style>
  .t { font: 14px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .t-muted { font: 12px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b6b6b; }
  .t-title { font: 600 15px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .box { fill: #ffffff; stroke: #1f1f1f; stroke-width: 1.25; rx: 6; }
  .box-soft { fill: #f3f0fb; stroke: #6c5ce7; stroke-width: 1.25; rx: 6; }
  .bar-before { fill: #c9c9c9; }
  .bar-after { fill: #6c5ce7; }
  .grid { stroke: #e5e5e5; stroke-width: 1; }
  .arrow { stroke: #1f1f1f; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>
<defs><marker id="arrowhead-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker></defs>

<text class="t-title" x="20" y="26">How a claim is checked without the engine</text>

<text class="t-muted" x="186" y="64" text-anchor="middle">a question</text>
<text class="t-muted" x="359" y="64" text-anchor="middle">which pieces defend which</text>
<text class="t-muted" x="532" y="64" text-anchor="middle">a checked claim</text>

<rect class="box" x="30" y="76" width="140" height="56"/>
<text class="t" x="100" y="99" text-anchor="middle">The player asks</text>
<text class="t" x="100" y="117" text-anchor="middle">a question</text>

<rect class="box" x="203" y="76" width="140" height="56"/>
<text class="t" x="273" y="109" text-anchor="middle">The board</text>

<rect class="box-soft" x="376" y="76" width="140" height="56"/>
<text class="t" x="446" y="109" text-anchor="middle">The claim check</text>

<rect class="box" x="549" y="76" width="140" height="56"/>
<text class="t" x="619" y="109" text-anchor="middle">The answer</text>

<path class="arrow" d="M170,104 L199,104"/>
<path class="arrow" d="M343,104 L372,104"/>
<path class="arrow" d="M516,104 L545,104"/>

<path d="M100,132 L100,190 L199,190" stroke="#c9c9c9" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowhead-muted)"/>
<rect x="203" y="168" width="280" height="44" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.25" rx="6" stroke-dasharray="5 4"/>
<text class="t-muted" x="343" y="195" text-anchor="middle">Every question to the chess engine</text>
<text class="t-muted" x="499" y="195">Rejected: slow, and against the rule</text>
</svg>
