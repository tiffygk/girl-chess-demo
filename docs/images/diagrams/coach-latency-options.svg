<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-label="Three ways to make the coach faster. A metered interface answers in about 1 to 2 seconds for about 10 to 15 dollars a month and was rejected. Keeping one assistant warm answers in 2 to 4 seconds at no cost and was chosen. Leaving it alone keeps about 9 seconds and was not viable. Reply time fell from about 9 seconds to 2 to 4 seconds.">
<style>
  .t { font: 14px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .t-muted { font: 12px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b6b6b; }
  .t-title { font: 600 15px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .box { fill: #ffffff; stroke: #1f1f1f; stroke-width: 1.25; rx: 6; }
  .box-soft { fill: #f3f0fb; stroke: #6c5ce7; stroke-width: 1.25; rx: 6; }
  .bar-before { fill: #c9c9c9; }
  .bar-after { fill: #6c5ce7; }
  .grid { stroke: #e5e5e5; stroke-width: 1; }
  .arrow { stroke: #1f1f1f; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>

<text class="t-title" x="20" y="26">Three ways to make the coach faster</text>

<text class="t-muted" x="36" y="56">Option</text>
<text class="t-muted" x="330" y="56">Reply time</text>
<text class="t-muted" x="500" y="56">Cost a month</text>
<text class="t-muted" x="610" y="56">Verdict</text>

<rect class="box" x="20" y="66" width="680" height="44"/>
<text class="t" x="36" y="93">Pay a metered interface</text>
<text class="t" x="330" y="93">about 1 to 2 seconds</text>
<text class="t" x="500" y="93">$10 to $15</text>
<text class="t" x="610" y="93">Rejected</text>

<rect class="box-soft" x="20" y="120" width="680" height="44"/>
<text class="t" x="36" y="147">Keep one assistant warm</text>
<text class="t" x="330" y="147">2 to 4 seconds</text>
<text class="t" x="500" y="147">$0</text>
<text class="t" x="610" y="147">Chosen</text>

<rect class="box" x="20" y="174" width="680" height="44"/>
<text class="t" x="36" y="201">Leave it alone</text>
<text class="t" x="330" y="201">about 9 seconds</text>
<text class="t" x="500" y="201">$0</text>
<text class="t" x="610" y="201">Not viable</text>

<text class="t-muted" x="20" y="250">Chat reply time, before and after the chosen option</text>

<rect class="bar-before" x="20" y="262" width="180" height="14"/>
<text class="t" x="212" y="273">about 9 seconds before</text>

<rect class="bar-after" x="20" y="292" width="140" height="14"/>
<text class="t" x="212" y="303">about 7 seconds after</text>
</svg>
