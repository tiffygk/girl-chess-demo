<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 275" width="100%" role="img" aria-label="Four rising steps showing that each press of the help button climbs one rung, from where to look, to narrower, to narrower still, to the move. At most three steps when she is on the right idea, at most four when she is not.">
<rect width="720" height="275" rx="8" fill="#ffffff"/>
<style>
  .t { font: 14px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .t-muted { font: 12px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b6b6b; }
  .t-title { font: 600 15px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .box { fill: #ffffff; stroke: #1f1f1f; stroke-width: 1.25; rx: 6; }
  .box-soft { fill: #f3f0fb; stroke: #6c5ce7; stroke-width: 1.25; rx: 6; }
  .bar-before { fill: #c9c9c9; }
  .bar-after { fill: #6c5ce7; }
  .grid { stroke: #e5e5e5; stroke-width: 1; }
  .arrow { stroke: #1f1f1f; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>

<text class="t-title" x="30" y="30">Each press of help? climbs one rung</text>

<rect class="box" x="40" y="190" width="140" height="44"/>
<text class="t" x="110" y="217" text-anchor="middle">where to look</text>

<rect class="box" x="210" y="155" width="140" height="44"/>
<text class="t" x="280" y="182" text-anchor="middle">narrower</text>

<rect class="box" x="380" y="120" width="140" height="44"/>
<text class="t" x="450" y="147" text-anchor="middle">narrower still</text>

<rect class="box-soft" x="550" y="85" width="140" height="44"/>
<text class="t" x="620" y="112" text-anchor="middle">the move</text>

<path class="arrow" d="M183,206 L205,184"/>
<path class="arrow" d="M353,171 L375,149"/>
<path class="arrow" d="M523,136 L545,114"/>

<text class="t-muted" x="40" y="258">at most three steps when she is on the right idea, at most four when she is not</text>
</svg>
