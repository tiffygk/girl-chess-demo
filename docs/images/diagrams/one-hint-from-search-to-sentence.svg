<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" width="100%" role="img" aria-label="A flow for one hint. The position goes to an engine search of 1.5 seconds returning several candidates, then code picks one, then a check plays it and searches half a second to confirm it does not lose more than half a pawn. A failed check goes to a 3-second search and back. What passes becomes the verified hint, and the verified hint becomes the sentence on the rung.">
<rect width="720" height="345" rx="8" fill="#ffffff"/>
<style>
  .t { font: 14px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .t-muted { font: 12px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b6b6b; }
  .t-title { font: 600 15px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .box { fill: #ffffff; stroke: #1f1f1f; stroke-width: 1.25; rx: 6; }
  .box-soft { fill: #f3f0fb; stroke: #6c5ce7; stroke-width: 1.25; rx: 6; }
  .bar-before { fill: #c9c9c9; }
  .bar-after { fill: #6c5ce7; }
  .grid { stroke: #e5e5e5; stroke-width: 1; }
  .arrow { stroke: #1f1f1f; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>

<text class="t-title" x="30" y="28">One hint, from search to sentence</text>

<rect class="box" x="30" y="58" width="150" height="56"/>
<text class="t" x="105" y="91" text-anchor="middle">the position</text>

<rect class="box" x="215" y="58" width="250" height="56"/>
<text class="t" x="340" y="82" text-anchor="middle">engine search, 1.5 seconds,</text>
<text class="t" x="340" y="100" text-anchor="middle">several candidates</text>

<rect class="box" x="500" y="58" width="180" height="56"/>
<text class="t" x="590" y="91" text-anchor="middle">code picks one</text>

<path class="arrow" d="M184,86 H211"/>
<path class="arrow" d="M469,86 H496"/>
<path class="arrow" d="M590,114 V140 H180 V172"/>

<rect class="box" x="30" y="176" width="300" height="60"/>
<text class="t" x="180" y="200" text-anchor="middle">check: play it, search half a second,</text>
<text class="t" x="180" y="218" text-anchor="middle">must not lose more than half a pawn</text>

<rect class="box-soft" x="370" y="184" width="140" height="44"/>
<text class="t" x="440" y="211" text-anchor="middle">verified hint</text>

<rect class="box" x="545" y="184" width="165" height="44"/>
<text class="t" x="627" y="205" text-anchor="middle">the sentence</text>
<text class="t" x="627" y="221" text-anchor="middle">on the rung</text>

<path class="arrow" d="M334,206 H366"/>
<path class="arrow" d="M514,206 H541"/>

<rect class="box" x="370" y="280" width="140" height="40"/>
<text class="t" x="440" y="305" text-anchor="middle">3-second search</text>

<path class="arrow" d="M180,236 V300 H366"/>
<text class="t-muted" x="195" y="293">failed</text>
<path class="arrow" d="M440,278 V232"/>
</svg>
