<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-label="Two before and after comparisons. Wrong statements about where pieces stand fell from 7.5 percent to 0. The wait on an explanation question fell from 13 to 15 seconds to about 4 seconds.">
<rect width="720" height="300" rx="8" fill="#ffffff"/>
<style>
  .t { font: 14px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .t-muted { font: 12px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b6b6b; }
  .t-title { font: 600 15px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .box { fill: #ffffff; stroke: #1f1f1f; stroke-width: 1.25; rx: 6; }
  .box-soft { fill: #f3f0fb; stroke: #6c5ce7; stroke-width: 1.25; rx: 6; }
  .bar-before { fill: #c9c9c9; }
  .bar-after { fill: #6c5ce7; }
  .grid { stroke: #e5e5e5; stroke-width: 1; }
  .arrow { stroke: #1f1f1f; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>

<text class="t-title" x="20" y="26">What the fix changed for the player</text>

<text class="t" x="40" y="58">Placement errors</text>
<text class="t" x="400" y="58">Explanation answer time</text>

<line class="grid" x1="40" y1="250" x2="340" y2="250"/>
<line class="grid" x1="400" y1="250" x2="700" y2="250"/>

<rect class="bar-before" x="70" y="130" width="64" height="120"/>
<text class="t" x="102" y="122" text-anchor="middle">7.5%</text>
<text class="t-muted" x="102" y="268" text-anchor="middle">before</text>

<line x1="200" y1="250" x2="264" y2="250" stroke="#6c5ce7" stroke-width="2"/>
<text class="t" x="232" y="238" text-anchor="middle">0</text>
<text class="t-muted" x="232" y="268" text-anchor="middle">after</text>

<rect class="bar-before" x="430" y="130" width="64" height="120"/>
<text class="t" x="462" y="122" text-anchor="middle">13 to 15 seconds</text>
<text class="t-muted" x="462" y="268" text-anchor="middle">before</text>

<rect class="bar-after" x="560" y="218" width="64" height="32"/>
<text class="t" x="592" y="210" text-anchor="middle">about 4 seconds</text>
<text class="t-muted" x="592" y="268" text-anchor="middle">after</text>

<text class="t-muted" x="20" y="292">Both results held for the smaller model and the larger one.</text>
</svg>
