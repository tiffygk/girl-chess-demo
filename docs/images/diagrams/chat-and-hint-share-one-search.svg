<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" role="img" aria-label="The position feeds one verified search. That one search feeds two consumers, the hint on the rung and the chat's fact list. A move she names in chat gets its line worked out the same way and joins the fact list. Fallback only: the half-second unverified look, used when the verified search returns nothing.">
<rect width="720" height="360" rx="8" fill="#ffffff"/>
<style>
  .t { font: 14px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .t-muted { font: 12px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b6b6b; }
  .t-title { font: 600 15px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1f1f; }
  .box { fill: #ffffff; stroke: #1f1f1f; stroke-width: 1.25; rx: 6; }
  .box-soft { fill: #f3f0fb; stroke: #6c5ce7; stroke-width: 1.25; rx: 6; }
  .bar-before { fill: #c9c9c9; }
  .bar-after { fill: #6c5ce7; }
  .grid { stroke: #e5e5e5; stroke-width: 1; }
  .arrow { stroke: #1f1f1f; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
</style>
<defs>
<marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker>
<marker id="arrowhead-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker>
</defs>

<text class="t-title" x="30" y="28">The chat and the hint read the same search</text>

<rect class="box" x="30" y="100" width="140" height="44"/>
<text class="t" x="100" y="127" text-anchor="middle">the position</text>

<rect class="box-soft" x="215" y="100" width="170" height="44"/>
<text class="t" x="300" y="127" text-anchor="middle">one verified search</text>

<path class="arrow" d="M174,122 H211"/>

<rect class="box" x="470" y="55" width="200" height="44"/>
<text class="t" x="570" y="82" text-anchor="middle">the hint on the rung</text>

<rect class="box" x="470" y="150" width="200" height="44"/>
<text class="t" x="570" y="177" text-anchor="middle">the chat's fact list</text>

<path class="arrow" d="M389,116 L466,83"/>
<path class="arrow" d="M389,128 L466,165"/>

<rect class="box" x="100" y="250" width="250" height="44" stroke-dasharray="5 4"/>
<text class="t" x="225" y="277" text-anchor="middle">a move she names in chat</text>

<path class="arrow" d="M225,248 V190 H466"/>
<text class="t-muted" x="240" y="212">its line, worked out the same way</text>

<rect x="470" y="290" width="240" height="56" rx="6" fill="#f7f7f7" stroke="#c9c9c9" stroke-width="1.25" stroke-dasharray="5 4"/>
<text class="t-muted" x="590" y="308" text-anchor="middle">fallback only: the half-second</text>
<text class="t-muted" x="590" y="322" text-anchor="middle">unverified look, used when the</text>
<text class="t-muted" x="590" y="338" text-anchor="middle">verified search returns nothing</text>
<path d="M590,288 V198" stroke="#c9c9c9" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowhead-muted)"/>
</svg>
