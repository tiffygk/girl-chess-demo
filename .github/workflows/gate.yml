name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: ./setup.sh
      - run: npm run gate
